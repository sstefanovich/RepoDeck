<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>RepoDeck</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="logo">⎇</span>
        <span>RepoDeck</span>
      </div>
      <button class="btn primary open-repo-btn" data-action="open-repo-folder" title="Pick a folder that already has a git repo in it (or drag a folder onto the window)">📂 Open repo folder…</button>
      <div id="ws-list" class="ws-list"></div>
      <div class="sidebar-foot">
        <button class="btn ghost block" data-action="new-ws"><span class="ico" aria-hidden="true">▦</span>New workspace</button>
        <button class="btn ghost block" data-action="clone"><span class="ico" aria-hidden="true">⤓</span>Clone a repo…</button>
        <button class="btn ghost block" data-action="new-repo" title="Turn a folder into a repo and put it on GitHub or Azure DevOps"><span class="ico" aria-hidden="true">＋</span>New repo…</button>
        <button class="btn ghost block" data-action="claude-toggle" title="Ctrl+J"><span class="ico" aria-hidden="true">✦</span>Ask Claude</button>
        <div class="foot-row">
          <button class="btn ghost" data-action="settings">⚙ Settings</button>
          <button class="btn ghost" data-action="help">? Git explained</button>
        </div>
      </div>
    </aside>
    <main id="main">
      <div id="tabbar" class="tabbar" role="tablist"></div>
      <div id="view" class="view"></div>
      <section id="console" class="console" hidden aria-label="Console">
        <div id="console-resize" class="console-resize" title="Drag to resize"></div>
        <div class="console-head">
          <span class="console-title">⌨ Console</span>
          <span id="console-where" class="muted small console-where"></span>
          <div class="spacer"></div>
          <button class="btn small ghost" data-action="console-help">Help</button>
          <button class="btn small ghost" data-action="console-terminal" title="For commands that need a full terminal: an editor, rebase -i, add -p">Open in Windows Terminal</button>
          <button class="btn small ghost" data-action="console-clear" title="Ctrl+L">Clear</button>
          <button class="icon-btn" data-action="console-toggle" title="Close (Ctrl+`)" aria-label="Close the console">✕</button>
        </div>
        <div id="console-out" class="console-out" role="log" aria-live="polite" tabindex="0"></div>
        <div class="console-in">
          <label for="console-input" id="console-prompt" class="console-prompt"></label>
          <input id="console-input" spellcheck="false" autocomplete="off">
          <button class="btn small" id="console-stop" data-action="console-stop" hidden title="Ctrl+C">■ Stop</button>
        </div>
      </section>
      <div id="log" class="log">
        <div class="log-bar">
          <button class="log-head" data-action="toggle-log">
            <span class="log-caret">▸</span>
            <span>Behind the scenes — the git commands this app runs for you</span>
            <span id="log-count" class="count"></span>
          </button>
          <button id="console-toggle-btn" class="console-btn" data-action="console-toggle" title="Type git commands yourself (Ctrl+`)" aria-expanded="false">⌨ Console</button>
        </div>
        <div id="log-body" class="log-body"></div>
      </div>
    </main>
    <aside id="claude-panel" class="claude-panel" hidden>
      <div class="cp-head">
        <span class="cp-logo">✦</span>
        <div class="cp-title"><b>Claude</b><div id="cp-scope" class="cp-scope"></div></div>
        <div class="spacer"></div>
        <button class="btn small ghost" data-action="claude-history" title="Earlier chats in this workspace">History</button>
        <button class="btn small ghost" data-action="claude-new" title="Start a new conversation">New chat</button>
        <button class="icon-btn" data-action="claude-toggle" title="Close (Ctrl+J)" aria-label="Close Claude panel">✕</button>
      </div>
      <div id="cp-banner"></div>
      <div id="cp-msgs" class="cp-msgs"></div>
      <div class="cp-input">
        <textarea id="cp-input" rows="3" placeholder="Ask Claude about your branches… (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="cp-input-row">
          <span id="cp-status" class="hint"></span>
          <div class="spacer"></div>
          <button class="btn small primary" id="cp-send" data-action="claude-send">Send</button>
        </div>
      </div>
    </aside>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="lib.js"></script>
  <!-- The UI, as plain scripts sharing one global scope. Order matters: app.js (event handling, start-up) goes last. -->
  <script src="core.js"></script>
  <script src="sidebar.js"></script>
  <script src="repo.js"></script>
  <script src="branches.js"></script>
  <script src="history.js"></script>
  <script src="pull-requests.js"></script>
  <script src="repo-tabs.js"></script>
  <script src="workspace.js"></script>
  <script src="setup.js"></script>
  <script src="menus.js"></script>
  <script src="claude-panel.js"></script>
  <script src="console.js"></script>
  <script src="app.js"></script>
</body>
</html>
